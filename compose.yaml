services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: sporthive_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - sporthive_network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: sporthive_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sporthive_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sporthive_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sporthive_db
      MYSQL_USER: sporthive_user
      MYSQL_PASSWORD: sporthive_password
    ports:
      - "3307:3306"
    volumes:
      - sporthive_db_data:/var/lib/mysql
    networks:
      - sporthive_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  sporthive_network:
    driver: bridge

volumes:
  sporthive_db_data:
    driver: local
